<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Carlos A Casas</title>
<meta name="description" content="Carlos A Casas — Ingeniero Industrial · MBA · Desarrollo de Negocios y Transformación Digital.">
<meta name="theme-color" content="#0d0f12">
<style>
  :root{
    --bg-0:#0b0d10; --bg-1:#111419;
    --surface:rgba(255,255,255,.05); --surface-2:rgba(255,255,255,.07);
    --border:rgba(255,255,255,.10); --border-strong:rgba(255,255,255,.18);
    --text:#f4f5f7; --text-muted:#a7adb8; --text-dim:#7b828c;
    --accent:#d9b26b; --accent-soft:rgba(217,178,107,.14); --accent-line:rgba(217,178,107,.32);
    --accent-hover:#e4c07f; --on-accent:#1a1204;
    --radius:22px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--text);
    background:
      radial-gradient(1000px 640px at 80% -10%, rgba(217,178,107,.10), transparent 60%),
      radial-gradient(820px 640px at 6% 110%, rgba(120,150,220,.07), transparent 55%),
      linear-gradient(180deg,var(--bg-1),var(--bg-0));
    background-attachment:fixed;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:16px 14px calc(16px + env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased;
  }
  .card{
    width:100%;
    max-width:400px;
    margin-block:auto;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:0 24px 60px -22px rgba(0,0,0,.65);
    padding:22px 20px 18px;
    position:relative;
  }
  .lang{
    position:absolute;top:12px;right:12px;
    display:flex;gap:2px;
    background:var(--surface-2);border:1px solid var(--border);
    border-radius:999px;padding:3px;z-index:3;
  }
  .lang button{
    border:0;background:transparent;color:var(--text-dim);
    padding:4px 9px;border-radius:999px;cursor:pointer;
    font:inherit;font-size:11px;font-weight:600;letter-spacing:.04em;
  }
  .lang button.active{background:var(--accent);color:var(--on-accent)}

  .avatar-wrap{display:flex;justify-content:center}
  .avatar{
    width:92px;height:92px;border-radius:50%;
    object-fit:cover;object-position:50% 16%;
    border:1px solid var(--border-strong);
    box-shadow:0 0 0 4px rgba(255,255,255,.03);
    background:#1b1f25;display:block;
  }
  h1{
    text-align:center;font-weight:650;letter-spacing:-.02em;
    font-size:clamp(1.35rem,5.5vw,1.6rem);margin-top:12px;
  }
  .role{
    text-align:center;margin-top:6px;color:var(--accent);
    font-size:.68rem;font-weight:600;letter-spacing:.11em;text-transform:uppercase;line-height:1.5;
  }
  .place{
    text-align:center;margin-top:6px;color:var(--text-dim);font-size:.78rem;
    display:flex;align-items:center;justify-content:center;gap:5px;
  }
  .place svg{width:12px;height:12px;opacity:.8}
  .bio{
    margin-top:11px;color:var(--text-muted);
    font-size:.82rem;line-height:1.5;text-align:center;
  }
  .chips{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:11px}
  .chip{
    font-size:.66rem;font-weight:600;color:var(--text);
    background:var(--accent-soft);border:1px solid var(--accent-line);
    padding:3px 8px;border-radius:999px;white-space:nowrap;
  }
  .divider{height:1px;background:var(--border);margin:14px 0 12px}

  .primary{
    display:flex;align-items:center;gap:10px;width:100%;
    padding:11px 13px;border-radius:13px;border:0;
    background:var(--accent);color:var(--on-accent);
    font:inherit;font-weight:650;font-size:.86rem;cursor:pointer;text-align:left;
  }
  .primary:hover{background:var(--accent-hover)}
  .primary .pi{width:28px;height:28px;flex:none;display:grid;place-items:center;border-radius:8px;background:rgba(0,0,0,.14)}
  .primary .pi svg{width:15px;height:15px}
  .primary .pt{display:flex;flex-direction:column;line-height:1.25;min-width:0}
  .primary .pt small{font-size:.7rem;font-weight:500;opacity:.7;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px}
  .b{
    display:flex;align-items:center;justify-content:center;gap:7px;
    padding:10px 6px;border-radius:11px;
    border:1px solid var(--border);background:var(--surface-2);
    color:var(--text);font:inherit;font-size:.78rem;font-weight:550;
    cursor:pointer;text-decoration:none;text-align:center;
  }
  .b:hover{background:rgba(255,255,255,.11);border-color:var(--border-strong)}
  .b svg{width:15px;height:15px;flex:none;color:var(--accent)}
  .b.li svg{fill:var(--accent);stroke:none}

  .palette{display:none;flex-direction:column;align-items:center;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--border)}
  .palette.is-visible{display:flex}
  .palette .lbl{font-size:.62rem;letter-spacing:.13em;text-transform:uppercase;color:var(--text-dim)}
  .sw-row{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}
  .swatch{width:20px;height:20px;border-radius:50%;border:1px solid rgba(255,255,255,.25);cursor:pointer;padding:0;transition:transform .13s}
  .swatch:hover{transform:scale(1.15)}
  .swatch.active{box-shadow:0 0 0 2px var(--bg-1),0 0 0 4px currentColor}
  .dl-btn{
    margin-top:2px;padding:8px 14px;border-radius:10px;
    border:1px solid var(--accent-line);background:var(--accent-soft);
    color:var(--text);font:inherit;font-size:.74rem;font-weight:600;cursor:pointer;
  }
  .dl-btn:hover{background:rgba(255,255,255,.1)}

  .share-btn{
    display:flex;align-items:center;justify-content:center;gap:8px;
    width:100%;margin-top:7px;padding:10px;border-radius:11px;
    border:1px solid var(--accent-line);background:var(--accent-soft);
    color:var(--text);font:inherit;font-size:.8rem;font-weight:600;cursor:pointer;
  }
  .share-btn:hover{background:rgba(255,255,255,.11)}
  .share-btn svg{width:15px;height:15px;color:var(--accent)}
  .sh-url{font-size:.74rem;color:#5b616b;margin-top:8px;word-break:break-all;font-family:ui-monospace,Menlo,Consolas,monospace}
  .qr-close.alt{background:var(--accent);color:var(--on-accent)}
  .qr-close.alt:hover{background:var(--accent-hover)}
  .qr-close.ghost{background:transparent;color:#5b616b;border:1px solid #d9dde2;margin-top:6px}
  .qr-close.ghost:hover{background:#f1f3f5}

  footer{margin-top:12px;text-align:center;color:var(--text-dim);font-size:.66rem}

  .overlay{
    position:fixed;inset:0;background:rgba(6,7,9,.85);
    display:flex;align-items:center;justify-content:center;padding:22px;z-index:50;
    opacity:0;pointer-events:none;transition:opacity .2s;
  }
  .overlay.open{opacity:1;pointer-events:auto}
  .qr-card{background:#fff;color:#111;border-radius:20px;padding:22px 22px 18px;width:100%;max-width:320px;text-align:center}
  .qr-card h2{font-size:1rem;font-weight:650;color:#15181d}
  .qr-card p{font-size:.8rem;color:#5b616b;margin-top:5px;line-height:1.45}
  .qr-box{margin:14px auto 4px;width:220px;max-width:100%;aspect-ratio:1}
  .qr-box img{width:100%;height:100%;display:block}
  .qr-close{margin-top:12px;width:100%;padding:10px;border-radius:11px;border:0;background:#15181d;color:#fff;font:inherit;font-weight:600;font-size:.85rem;cursor:pointer}
  .qr-close:hover{background:#2a2f37}

  .toast{
    position:fixed;left:50%;bottom:22px;transform:translate(-50%,16px);
    background:#20242b;color:#fff;border:1px solid var(--border-strong);
    padding:9px 16px;border-radius:999px;font-size:.8rem;font-weight:600;
    opacity:0;pointer-events:none;transition:.22s;z-index:60;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  @media (max-height:720px){
    .avatar{width:76px;height:76px}
    h1{margin-top:9px}
    .bio{font-size:.78rem;margin-top:9px}
    .chips{margin-top:9px}
    .divider{margin:11px 0 10px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  ].join("\r\n");

  var state = { lang: "es" };
  (function(){
    var fl = (document.documentElement.getAttribute("data-lang") || "").toLowerCase();
    if (fl === "es" || fl === "en") { state.lang = fl; return; }
    try {
      var saved = localStorage.getItem("cc-lang");
      if (saved === "es" || saved === "en") state.lang = saved;
    } catch (e) {}
  })();

  function t(key){ return (I18N[state.lang] && I18N[state.lang][key]) || I18N.es[key] || ""; }

  function applyLang(){
    var dict = I18N[state.lang];
    document.documentElement.lang = state.lang;
    document.querySelectorAll("[data-i18n]").forEach(function(el){
      var k = el.getAttribute("data-i18n");
      if (dict[k] != null) el.innerHTML = dict[k];
    });
    var chips = document.getElementById("chips");
    chips.innerHTML = "";
    dict.chips.forEach(function(c){
      var s = document.createElement("span");
      s.className = "chip"; s.textContent = c;
      chips.appendChild(s);
    });
    document.querySelectorAll(".lang button").forEach(function(b){
      b.classList.toggle("active", b.getAttribute("data-lang") === state.lang);
    });
    try { localStorage.setItem("cc-lang", state.lang); } catch (e) {}
  }

  document.querySelectorAll(".lang button").forEach(function(b){
    b.addEventListener("click", function(){
      state.lang = b.getAttribute("data-lang");
      applyLang();
    });
  });

  var toastEl = document.getElementById("toast"), toastTimer;
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove("show"); }, 1800);
  }

  function copyText(text, okMsg){
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function(){ toast(okMsg); }, fb);
    } else { fb(); }
    function fb(){
      var ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); toast(okMsg); } catch (e) { toast(text); }
      document.body.removeChild(ta);
    }
  }

  document.getElementById("copyEmail").addEventListener("click", function(){ copyText(DATA.email, t("copiedEmail")); });
  document.getElementById("copyPhone").addEventListener("click", function(){ copyText(DATA.phoneDisplay, t("copiedPhone")); });

  document.getElementById("saveContact").addEventListener("click", function(){
    var blob = new Blob([vcard], { type: "text/vcard;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = "Carlos-A-Casas.vcf";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
    toast(t("contactReady"));
  });

  var PALETTES = [
    { id: "oro",       name: "Oro / Gold",         accent: "#d9b26b", hover: "#e4c07f", on: "#1a1204" },
    { id: "azul",      name: "Azul / Blue",        accent: "#6ea8dd", hover: "#88bce9", on: "#071726" },
    { id: "esmeralda", name: "Esmeralda / Emerald", accent: "#46c493", hover: "#63d3a7", on: "#052018" },
    { id: "cobre",     name: "Cobre / Copper",      accent: "#e08a63", hover: "#ea9f7d", on: "#2a1006" },
    { id: "platino",   name: "Platino / Platinum",  accent: "#cbd2dc", hover: "#dde3ea", on: "#14171c" }
  ];
  function hexToRgba(hex, a){
    var h = hex.replace("#", "");
    return "rgba(" + parseInt(h.substring(0,2),16) + "," + parseInt(h.substring(2,4),16) + "," + parseInt(h.substring(4,6),16) + "," + a + ")";
  }
  function isPal(id){ return PALETTES.some(function(p){ return p.id === id; }); }
  function palById(id){ return PALETTES.filter(function(p){ return p.id === id; })[0]; }
  var curPal = "oro";

  function applyPalette(p){
    curPal = p.id;
    var s = document.documentElement.style;
    s.setProperty("--accent", p.accent);
    s.setProperty("--accent-hover", p.hover);
    s.setProperty("--on-accent", p.on);
    s.setProperty("--accent-soft", hexToRgba(p.accent, 0.14));
    s.setProperty("--accent-line", hexToRgba(p.accent, 0.32));
    document.querySelectorAll("#palette .swatch").forEach(function(b){
      b.classList.toggle("active", b.getAttribute("data-pal") === p.id);
    });
    try { localStorage.setItem("cc-palette", p.id); } catch (e) {}
  }

  function startingPaletteId(){
    var forced = (document.documentElement.getAttribute("data-palette") || "").toLowerCase();
    if (isPal(forced)) return forced;
    var hash = (location.hash || "").replace("#", "").toLowerCase();
    if (isPal(hash)) return hash;
    try { var s = (localStorage.getItem("cc-palette") || "").toLowerCase(); if (isPal(s)) return s; } catch (e) {}
    return "oro";
  }

  var paletteBox = document.getElementById("palette");
  var swRow = document.getElementById("sw-row");
  (function buildPalette(){
    PALETTES.forEach(function(p){
      var b = document.createElement("button");
      b.type = "button"; b.className = "swatch";
      b.setAttribute("data-pal", p.id);
      b.setAttribute("aria-label", p.name); b.title = p.name;
      b.style.background = p.accent; b.style.color = p.accent;
      b.addEventListener("click", function(){ applyPalette(p); });
      swRow.appendChild(b);
    });
    applyPalette(palById(startingPaletteId()) || PALETTES[0]);
  })();

  function setPaletteUI(show){
    paletteBox.classList.toggle("is-visible", show);
    try { localStorage.setItem("cc-palette-ui", show ? "1" : "0"); } catch (e) {}
  }
  (function initPaletteUI(){
    var uiOn = false;
    try { uiOn = localStorage.getItem("cc-palette-ui") === "1"; } catch (e) {}
    var hash = (location.hash || "").replace("#", "").toLowerCase();
    if (hash === "colores" || hash === "color") uiOn = true;
    if (isPal(hash)) uiOn = true;
    if (uiOn) setPaletteUI(true);
  })();
  document.addEventListener("keydown", function(e){
    if ((e.key === "c" || e.key === "C") && !e.metaKey && !e.ctrlKey && !e.altKey) {
      var tag = (e.target && e.target.tagName) || "";
      if (tag === "INPUT" || tag === "TEXTAREA") return;
      setPaletteUI(!paletteBox.classList.contains("is-visible"));
    }

    var a = document.createElement("a");

    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
    toast(t("downloaded"));
  });

  var PAGE_URL = "https://casascarlosalejandro-30.github.io/tarjeta/";

  var overlay = document.getElementById("overlay");
  var shareOv = document.getElementById("shareOv");
  function open(el){ el.classList.add("open"); }
  function closeAll(){ overlay.classList.remove("open"); shareOv.classList.remove("open"); }
  document.getElementById("showQR").addEventListener("click", function(){ open(overlay); });
  document.getElementById("qrClose").addEventListener("click", closeAll);

  document.getElementById("shClose").addEventListener("click", closeAll);
  document.getElementById("shCopy").addEventListener("click", function(){ copyText(PAGE_URL, t("linkCopied")); });

  var shShare = document.getElementById("shShare");
  if (navigator.share) {
    shShare.hidden = false;
    shShare.addEventListener("click", function(){
      navigator.share({ title: "Carlos A Casas", text: "Mi tarjeta de presentación", url: PAGE_URL }).catch(function(){});
    });
  }

  [overlay, shareOv].forEach(function(o){
    o.addEventListener("click", function(e){ if (e.target === o) closeAll(); });
  });
  document.addEventListener("keydown", function(e){ if (e.key === "Escape") closeAll(); });

  applyLang();
})();
</script>
